<!DOCTYPE html>
<!-- Deployed automatically by GitHub Actions (Step 21 CI/CD test) -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stem and Stars Photography</title>
<style>
  body { background:#111; color:#eee; font-family:Georgia, serif; margin:0; padding:2rem; }
  h1 { text-align:center; font-weight:normal; letter-spacing:.1em; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
          gap:1rem; max-width:1200px; margin:2rem auto; }
  figure { margin:0; }
  img { width:100%; height:auto; display:block; border-radius:4px; }
  figcaption { text-align:center; padding:.5rem; color:#bbb; font-style:italic; }
</style>
</head>
<body>
<h1>STEM AND STARS</h1>
<div class="grid" id="gallery"></div>
<script>
  fetch('photos.json')
    .then(r => r.json())
    .then(photos => {
      const gallery = document.getElementById('gallery');
      photos.forEach(p => {
        const fig = document.createElement('figure');
        fig.innerHTML = '<a href="' + p.image + '"><img src="' + p.thumb +
                        '" alt="' + p.title + '"></a><figcaption>' +
                        p.title + '</figcaption>';
        gallery.appendChild(fig);
      });
    });
</script>
</body>
</html>
