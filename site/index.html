<!DOCTYPE html>
<!-- Deployed automatically by GitHub Actions (Step 21 CI/CD test) Verified Nov 1 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stem and Stars Photography</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
 body { background:#0e0e11; color:#eee; font-family:'Inter', Arial, sans-serif; margin:0; padding:0; }
.hero { position:relative; height:78vh; min-height:420px; overflow:hidden; }
.hero-img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; animation:heroFade 16s ease-in-out infinite; }
#hero-b { animation-delay:8s; }
@keyframes heroFade { 0% {opacity:0;} 10% {opacity:1;} 40% {opacity:1;} 50% {opacity:0;} 100% {opacity:0;} }
.hero-text { position:absolute; left:0; right:0; bottom:0; padding:2rem; background:linear-gradient(to top, rgba(0,0,0,.7), rgba(0,0,0,0)); }
.hero-text h1 { font-family:'Playfair Display', Georgia, serif; font-size:clamp(2.4rem, 6vw, 4.2rem); margin:0; font-weight:600; }
.hero-text p { margin:.6rem 0 0; text-transform:uppercase; letter-spacing:.35em; font-size:clamp(.65rem, 2vw, .9rem); color:#d9a441; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:1rem; max-width:1200px; margin:2rem auto; padding:0 1rem; }
figure { margin:0; }
img { width:100%; height:auto; display:block; border-radius:4px; }
figcaption { text-align:center; padding:.5rem; color:#bbb; font-style:italic; }
</style>
</head>
<body>
<header class="hero">
  <img class="hero-img" id="hero-a" src="images/Totality.jpg" alt="Totality - a total lunar eclipse">
  <img class="hero-img" id="hero-b" src="images/Sunrise.jpg" alt="Sunrise over the prairie">
  <div class="hero-text">
    <h1>Stem and Stars</h1>
    <p>Photography by Brett Manzke</p>
  </div>
</header>
<div class="grid" id="gallery"></div>
<script>
  fetch('photos.json')
    .then(r => r.json())
    .then(photos => {
      const gallery = document.getElementById('gallery');
      photos.forEach(p => {
        const fig = document.createElement('figure');
        fig.innerHTML = '<a href="' + p.image + '"><img src="' + p.thumb +
                        '" alt="' + p.title + '"></a><figcaption>' +
                        p.title + '</figcaption>';
        gallery.appendChild(fig);
      });
    });
</script>
</body>
</html>
