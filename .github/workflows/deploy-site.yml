name: Deploy site

on:
  push:
    branches: [main]
    paths: ['site/**']

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::288581186506:role/github-deploy-role
          aws-region: us-east-1

      - name: Sync site to S3
        run: aws s3 cp site/index.html s3://stemandstars-tf.com/index.html
    
      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id E1HLUSUZWTAUFA --paths "/*"
